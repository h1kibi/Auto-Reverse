[project]
name = "reverse-agent"
version = "0.7.3"
description = "LLM-native reverse engineering runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28.0",
  "pefile>=2023.2.7",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.23.0",
  "python-multipart>=0.0.6",
]

[project.optional-dependencies]
yara = ["yara-python>=4.0.0"]
dynamic = ["frida-tools>=12.0.0"]
ctf = [
  "z3-solver>=4.13",
  "angr>=9.2",
]
agent = [
  "openai>=1.0.0",
]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
reverse-agent = "re_agent.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["re_agent*"]
